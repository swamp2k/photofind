name: Patch global starred review actions

on:
  push:
    branches: [global-filter-sidebar]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Patch global starred review actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-filter-sidebar
      - name: Patch global starred review persistence
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/renderer/src/lite/LiteApp.tsx')
          text = path.read_text()

          old = """  function updateReview(targets: LiteMediaRecord[], state: LiteReviewState, undoLabel?: string): void {\n    applyReviewAssignments(new Map(targets.map((item) => [item.id, state])), undoLabel)\n  }\n\n  function pickBest"""
          new = """  function updateReview(targets: LiteMediaRecord[], state: LiteReviewState, undoLabel?: string): void {\n    applyReviewAssignments(new Map(targets.map((item) => [item.id, state])), undoLabel)\n  }\n\n  async function updateStarredReview(item: LiteMediaRecord, state: LiteReviewState): Promise<void> {\n    if (!showGlobalStarred || item.libraryId === activeLibrary?.id) {\n      updateReview([item], state)\n      return\n    }\n    const result = setReviewAssignments([item], new Map([[item.id, state]]))\n    if (result.changed.length === 0) return\n    const previous = item\n    try {\n      await putMediaRecords(result.changed)\n      window.dispatchEvent(new Event(LIBRARY_STATE_CHANGED_EVENT))\n      registerUndo('Review global starred photo', async () => {\n        await putMediaRecords([previous])\n        window.dispatchEvent(new Event(LIBRARY_STATE_CHANGED_EVENT))\n      })\n    } catch (cause) {\n      setError(`Review state could not be saved for the other photo index: ${messageOf(cause)}`)\n    }\n  }\n\n  function pickBest"""
          if old not in text:
              raise SystemExit('updateReview source block not found')
          text = text.replace(old, new, 1)

          old = """{view === 'starred' && <PhotoResults items={starredFilteredImages} visibleCount={visibleCount} batchSize={pageSize} flowLoading={settings.flowLoading} selectedId={null} sessionFiles={sessionFiles} onShowMore={() => setVisibleCount((count) => count + pageSize)} onReview={(item, state) => updateReview([item], state)} />}"""
          new = """{view === 'starred' && <PhotoResults items={starredFilteredImages} visibleCount={visibleCount} batchSize={pageSize} flowLoading={settings.flowLoading} selectedId={null} sessionFiles={sessionFiles} onShowMore={() => setVisibleCount((count) => count + pageSize)} onReview={(item, state) => void updateStarredReview(item, state)} />}"""
          if old not in text:
              raise SystemExit('Starred PhotoResults source block not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/patch-global-starred-review.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist review changes in global starred view"
          git push origin HEAD:global-filter-sidebar
