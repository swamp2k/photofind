name: Apply global filter sidebar refactor

on:
  push:
    branches: [global-filter-sidebar]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply global filter sidebar refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-filter-sidebar
      - name: Patch LiteApp
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/renderer/src/lite/LiteApp.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'Expected source block not found:\n{old[:300]}')
              text = text.replace(old, new, 1)

          replace_once(
              "import { isStarred, setPhotoStarred } from './starred'\n",
              "import { isStarred, setPhotoStarred } from './starred'\nimport { useGlobalStarredPhotos } from './globalStarred'\n"
          )

          replace_once(
              "  const [selectedMapId, setSelectedMapId] = useState<string | null>(null)\n  const filterToViewport = view === 'map'\n",
              "  const [selectedMapId, setSelectedMapId] = useState<string | null>(null)\n  const [showGlobalStarred, setShowGlobalStarred] = useState(false)\n  const filterToViewport = view === 'map'\n"
          )

          replace_once(
              "  const starredImages = useMemo(() => activeImages.filter(isStarred), [activeImages])\n  const personNamesById = useMemo(() => new Map(people.map((person) => [person.id, person.name?.trim() ?? ''])), [people])\n",
              "  const starredImages = useMemo(() => activeImages.filter(isStarred), [activeImages])\n  const globalStarred = useGlobalStarredPhotos(view === 'starred' && showGlobalStarred)\n  const personNamesById = useMemo(() => new Map(people.map((person) => [person.id, person.name?.trim() ?? ''])), [people])\n"
          )

          replace_once(
              "  const starredFilteredImages = useMemo(() => filteredImages.filter(isStarred), [filteredImages])\n  const currentBrowseImages = view === 'starred' ? starredFilteredImages : filteredImages\n  const currentBrowseTotal = view === 'starred' ? starredImages.length : reviewFilter === 'reject' ? reviewCounts.reject : activeImages.length\n",
              "  const globalStarredSearchedImages = useMemo(() => {\n    if (!showGlobalStarred) return globalStarred.items\n    const query = searchQuery.trim().toLocaleLowerCase()\n    if (!query) return globalStarred.items\n    return globalStarred.items.filter((item) => [item.name, item.relativePath, item.cameraMake, item.cameraModel]\n      .filter(Boolean)\n      .some((value) => String(value).toLocaleLowerCase().includes(query)))\n  }, [globalStarred.items, searchQuery, showGlobalStarred])\n  const starredFilteredImages = useMemo(() => showGlobalStarred\n    ? filterByReview(filterPhotos(globalStarredSearchedImages, baseFilters), reviewFilter)\n    : filteredImages.filter(isStarred), [baseFilters, filteredImages, globalStarredSearchedImages, reviewFilter, showGlobalStarred])\n  const currentBrowseImages = view === 'starred' ? starredFilteredImages : filteredImages\n  const currentBrowseTotal = view === 'starred' ? (showGlobalStarred ? globalStarred.items.length : starredImages.length) : reviewFilter === 'reject' ? reviewCounts.reject : activeImages.length\n"
          )

          replace_once(
              "              {browseControls && <details className=\"filter-disclosure\" open>\n                <summary><span>Find & filter</span><strong>{currentBrowseImages.length.toLocaleString()} matching</strong></summary>\n                <BrowseFilters",
              "              {browseControls && <details className=\"filter-disclosure\" open>\n                <summary><span>Find & filter</span><strong>{currentBrowseImages.length.toLocaleString()} matching</strong></summary>\n                {view === 'starred' && <label className=\"global-starred-toggle\">\n                  <input type=\"checkbox\" checked={showGlobalStarred} onChange={(event) => { setShowGlobalStarred(event.target.checked); setVisibleCount(pageSize) }} />\n                  <span><strong>Show Global</strong><small>Include starred photos from every local photo index, not only the active index.</small></span>\n                </label>}\n                {view === 'starred' && showGlobalStarred && globalStarred.loading && <div className=\"global-starred-status\">Loading starred photos across indexes…</div>}\n                {view === 'starred' && showGlobalStarred && !globalStarred.loading && !globalStarred.error && <div className=\"global-starred-status\">{globalStarred.items.length.toLocaleString()} starred photos across {globalStarred.libraryCount.toLocaleString()} indexes.</div>}\n                {view === 'starred' && showGlobalStarred && globalStarred.error && <div className=\"global-starred-status error\">Global starred photos could not be loaded: {globalStarred.error}</div>}\n                <BrowseFilters"
          )

          path.write_text(text)

          # Remove this one-shot workflow from the final tree.
          Path('.github/workflows/apply-global-sidebar-refactor.yml').unlink()
      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor views around resizable filter sidebar"
          git push origin HEAD:global-filter-sidebar
