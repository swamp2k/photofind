name: One-off Library event context fix

on:
  push:
    paths:
      - '.github/workflows/one-off-library-event-context-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/one_off_library_event_context_fix.py
      - name: Commit implementation
        run: |
          rm .github/workflows/one-off-library-event-context-fix.yml
          rm .github/scripts/one_off_library_event_context_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Library event context actions'
          git push
