name: One-off Library event context fix

on:
  push:
    paths:
      - ".github/workflows/one-off-library-event-context-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply event context fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          context = "src/renderer/src/lite/ContextMenu.tsx"
          replace(context, """  listKnownEvents?(photoId: string): PhotoContextEventDescriptor[]
  resolveEvent?(eventId: string, photoId: string): PhotoContextEventDescriptor | null
  addToEvent?(photoId: string, eventId: string): void | Promise<void>
  removeFromEvent?(photoId: string, eventId: string): void | Promise<void>
""", """  listKnownEvents?(photoIds: string[]): PhotoContextEventDescriptor[]
  resolveEvent?(eventId: string, photoIds: string[]): PhotoContextEventDescriptor | null
  createEvent?(photoIds: string[]): void | Promise<void>
  addToEvent?(photoIds: string[], eventId: string): void | Promise<void>
  removeFromEvent?(photoIds: string[], eventId: string): void | Promise<void>
""")

          replace(context, """        const knownEvents = photoActions.listKnownEvents?.(photo.id) ?? []
        const currentEventId = eventIdFromTarget(target)
        const currentEvent = currentEventId ? photoActions.resolveEvent?.(currentEventId, photo.id) ?? null : null
        const addChildren: PhotoFindContextMenuAction[] = knownEvents.length > 0
          ? knownEvents.map((knownEvent) => ({
              id: `add-event-${knownEvent.id}`,
              label: knownEvent.title,
              hint: knownEvent.containsPhoto ? 'Added' : knownEvent.hint,
              disabled: knownEvent.containsPhoto || !photoActions.addToEvent,
              onSelect: () => photoActions.addToEvent?.(photo.id, knownEvent.id)
            }))
          : [{ id: 'no-known-events', label: 'No known events yet', disabled: true, onSelect: () => undefined }]
        setMenu(positionMenu(event.clientX, event.clientY, {
          title: photo.name,
""", """        const targetPhotoIds = contextPhotoTargets(photo.id, selectedPhotoIdsForTarget(target))
        const knownEvents = photoActions.listKnownEvents?.(targetPhotoIds) ?? []
        const currentEventId = eventIdFromTarget(target)
        const currentEvent = currentEventId ? photoActions.resolveEvent?.(currentEventId, targetPhotoIds) ?? null : null
        const addChildren: PhotoFindContextMenuAction[] = []
        if (photoActions.createEvent) {
          addChildren.push({
            id: 'create-new-event',
            label: 'Create new event…',
            onSelect: () => photoActions.createEvent?.(targetPhotoIds)
          })
        }
        if (knownEvents.length > 0) {
          for (const [index, knownEvent] of knownEvents.entries()) {
            addChildren.push({
              id: `add-event-${knownEvent.id}`,
              label: knownEvent.title,
              hint: knownEvent.containsPhoto ? 'Added' : knownEvent.hint,
              disabled: knownEvent.containsPhoto || !photoActions.addToEvent,
              separatorBefore: index === 0 && Boolean(photoActions.createEvent),
              onSelect: () => photoActions.addToEvent?.(targetPhotoIds, knownEvent.id)
            })
          }
        } else {
          addChildren.push({
            id: 'no-known-events',
            label: 'No known events yet',
            disabled: true,
            separatorBefore: Boolean(photoActions.createEvent),
            onSelect: () => undefined
          })
        }
        setMenu(positionMenu(event.clientX, event.clientY, {
          title: targetPhotoIds.length > 1 ? `${targetPhotoIds.length.toLocaleString()} selected photos` : photo.name,
""")

          replace(context, """              disabled: !photoActions.addToEvent,
              children: addChildren,
              onSelect: () => undefined
            },
            ...(currentEvent && currentEvent.containsPhoto && photoActions.removeFromEvent ? [{
              id: 'remove-from-event',
              label: `Remove from “${currentEvent.title}”`,
              onSelect: () => photoActions.removeFromEvent?.(photo.id, currentEvent.id)
            }] : []),
""", """              disabled: !photoActions.addToEvent && !photoActions.createEvent,
              children: addChildren,
              onSelect: () => undefined
            },
            ...(currentEvent && currentEvent.containsPhoto && photoActions.removeFromEvent ? [{
              id: 'remove-from-event',
              label: targetPhotoIds.length > 1 ? `Remove ${targetPhotoIds.length.toLocaleString()} photos from “${currentEvent.title}”` : `Remove from “${currentEvent.title}”`,
              onSelect: () => photoActions.removeFromEvent?.(targetPhotoIds, currentEvent.id)
            }] : []),
""")

          replace(context, """function photoIdFromTarget(target: EventTarget | null): string | null {
""", """export function contextPhotoTargets(clickedPhotoId: string, selectedPhotoIds: readonly string[]): string[] {
  const selected = [...new Set(selectedPhotoIds.filter((id) => Boolean(id)))]
  return selected.includes(clickedPhotoId) ? selected : [clickedPhotoId]
}

function selectedPhotoIdsForTarget(target: EventTarget | null): string[] {
  if (!(target instanceof Element)) return []
  const owner = target.closest<HTMLElement>('[data-photofind-photo-id]')
  if (!owner?.closest('.explorer-selected')) return []
  return Array.from(document.querySelectorAll<HTMLElement>('.explorer-selected'))
    .map((selected) => selected.dataset.photofindPhotoId
      ?? selected.querySelector<HTMLElement>('[data-photofind-photo-id]')?.dataset.photofindPhotoId
      ?? '')
    .filter(Boolean)
}

function photoIdFromTarget(target: EventTarget | null): string | null {
""")

          photo_results = "src/renderer/src/lite/PhotoResults.tsx"
          replace(photo_results, """              <article className={[selected ? 'photo-card explorer-selected' : 'photo-card', mapSelected ? 'selected' : ''].filter(Boolean).join(' ')} key={item.id}>
""", """              <article className={[selected ? 'photo-card explorer-selected' : 'photo-card', mapSelected ? 'selected' : ''].filter(Boolean).join(' ')} key={item.id} data-photofind-photo-id={item.id}>
""")

          events_panel = "src/renderer/src/lite/EventsPanel.tsx"
          replace(events_panel, """                  return <article className={isSelected ? 'explorer-selected' : ''} key={item.id} data-photofind-event-id={selected.id}>
""", """                  return <article className={isSelected ? 'explorer-selected' : ''} key={item.id} data-photofind-event-id={selected.id} data-photofind-photo-id={item.id}>
""")

          lite = "src/renderer/src/lite/LiteApp.tsx"
          replace(lite, """  const [knownDatesOpen, setKnownDatesOpen] = useState(false)
  const [error, setError] = useState<string | null>(null)
""", """  const [knownDatesOpen, setKnownDatesOpen] = useState(false)
  const [contextCreateItemIds, setContextCreateItemIds] = useState<string[] | null>(null)
  const [contextCreateTitle, setContextCreateTitle] = useState('')
  const [contextCreateBusy, setContextCreateBusy] = useState(false)
  const [contextCreateError, setContextCreateError] = useState<string | null>(null)
  const [error, setError] = useState<string | null>(null)
""")

          replace(lite, """      listKnownEvents(photoId) {
        return eventsRef.current
          .filter(isKnownDateEvent)
          .sort((left, right) => right.startTime - left.startTime || left.title.localeCompare(right.title))
          .map((event) => ({
            id: event.id,
            title: event.title,
            hint: `${formatContextEventDate(event)} · ${event.itemIds.length.toLocaleString()}`,
            containsPhoto: event.itemIds.includes(photoId)
          }))
      },
      resolveEvent(eventId, photoId) {
        const event = eventsRef.current.find((candidate) => candidate.id === eventId)
        return event ? {
          id: event.id,
          title: event.title,
          hint: formatContextEventDate(event),
          containsPhoto: event.itemIds.includes(photoId)
        } : null
      },
      addToEvent(photoId, eventId) {
        return addPhotoToEventById(photoId, eventId)
      },
      removeFromEvent(photoId, eventId) {
        return removePhotoFromEventById(photoId, eventId)
      }
""", """      listKnownEvents(photoIds) {
        const targets = [...new Set(photoIds)]
        return eventsRef.current
          .filter(isKnownDateEvent)
          .sort((left, right) => right.startTime - left.startTime || left.title.localeCompare(right.title))
          .map((event) => {
            const included = targets.reduce((count, id) => count + (event.itemIds.includes(id) ? 1 : 0), 0)
            const partial = targets.length > 1 && included > 0 && included < targets.length
              ? `${included.toLocaleString()}/${targets.length.toLocaleString()} selected already added · `
              : ''
            return {
              id: event.id,
              title: event.title,
              hint: `${partial}${formatContextEventDate(event)} · ${event.itemIds.length.toLocaleString()}`,
              containsPhoto: targets.length > 0 && included === targets.length
            }
          })
      },
      resolveEvent(eventId, photoIds) {
        const event = eventsRef.current.find((candidate) => candidate.id === eventId)
        const targets = [...new Set(photoIds)]
        return event ? {
          id: event.id,
          title: event.title,
          hint: formatContextEventDate(event),
          containsPhoto: targets.length > 0 && targets.every((id) => event.itemIds.includes(id))
        } : null
      },
      createEvent(photoIds) {
        beginContextCreateEvent(photoIds)
      },
      addToEvent(photoIds, eventId) {
        return addPhotosToEventByIds(photoIds, eventId)
      },
      removeFromEvent(photoIds, eventId) {
        return removePhotosFromEventByIds(photoIds, eventId)
      }
""")

          replace(lite, """  async function addPhotoToEventById(photoId: string, eventId: string): Promise<void> {
    const event = eventsRef.current.find((candidate) => candidate.id === eventId && isKnownDateEvent(candidate))
    const item = mediaRef.current.find((candidate) => candidate.id === photoId && candidate.kind === 'image')
    if (!event || !item || event.itemIds.includes(photoId)) return
    const prior = matchingEventOverride(event, eventOverridesRef.current)
    const next = createEventPhotoAdditionOverride(event, [photoId], prior)
    const removeIds = prior && prior.id !== next.id ? [prior.id] : []
    try {
      setError(null)
      await saveEventOverrideBatch([next], removeIds)
      updateEventOverrideState([next], removeIds)
    } catch (cause) {
      setError(`Photo could not be added to “${event.title}”: ${messageOf(cause)}`)
    }
  }

  async function removePhotoFromEventById(photoId: string, eventId: string): Promise<void> {
    const event = eventsRef.current.find((candidate) => candidate.id === eventId)
    const item = mediaRef.current.find((candidate) => candidate.id === photoId && candidate.kind === 'image')
    if (!event || !item || !event.itemIds.includes(photoId)) return
    const prior = matchingEventOverride(event, eventOverridesRef.current)
    const next = createEventPhotoRemovalOverride(event, [photoId], prior)
    const removeIds = prior && prior.id !== next.id ? [prior.id] : []
    try {
      setError(null)
      await saveEventOverrideBatch([next], removeIds)
      updateEventOverrideState([next], removeIds)
    } catch (cause) {
      setError(`Photo could not be removed from “${event.title}”: ${messageOf(cause)}`)
    }
  }
""", """  async function addPhotosToEventByIds(photoIds: string[], eventId: string): Promise<void> {
    const event = eventsRef.current.find((candidate) => candidate.id === eventId && isKnownDateEvent(candidate))
    if (!event) return
    const availableIds = new Set(mediaRef.current.filter((candidate) => candidate.kind === 'image' && !isRejected(candidate)).map((candidate) => candidate.id))
    const additions = [...new Set(photoIds)].filter((id) => availableIds.has(id) && !event.itemIds.includes(id))
    if (additions.length === 0) return
    const prior = matchingEventOverride(event, eventOverridesRef.current)
    const next = createEventPhotoAdditionOverride(event, additions, prior)
    const removeIds = prior && prior.id !== next.id ? [prior.id] : []
    try {
      setError(null)
      await saveEventOverrideBatch([next], removeIds)
      updateEventOverrideState([next], removeIds)
    } catch (cause) {
      setError(`${additions.length === 1 ? 'Photo' : 'Photos'} could not be added to “${event.title}”: ${messageOf(cause)}`)
    }
  }

  async function removePhotosFromEventByIds(photoIds: string[], eventId: string): Promise<void> {
    const event = eventsRef.current.find((candidate) => candidate.id === eventId)
    if (!event) return
    const removals = [...new Set(photoIds)].filter((id) => event.itemIds.includes(id))
    if (removals.length === 0) return
    const prior = matchingEventOverride(event, eventOverridesRef.current)
    const next = createEventPhotoRemovalOverride(event, removals, prior)
    const removeIds = prior && prior.id !== next.id ? [prior.id] : []
    try {
      setError(null)
      await saveEventOverrideBatch([next], removeIds)
      updateEventOverrideState([next], removeIds)
    } catch (cause) {
      setError(`${removals.length === 1 ? 'Photo' : 'Photos'} could not be removed from “${event.title}”: ${messageOf(cause)}`)
    }
  }

  function beginContextCreateEvent(photoIds: string[]): void {
    const availableIds = new Set(mediaRef.current.filter((candidate) => candidate.kind === 'image' && !isRejected(candidate)).map((candidate) => candidate.id))
    const targets = [...new Set(photoIds)].filter((id) => availableIds.has(id))
    if (targets.length === 0) return
    setContextCreateItemIds(targets)
    setContextCreateTitle('')
    setContextCreateError(null)
  }

  async function submitContextCreateEvent(): Promise<void> {
    if (!contextCreateItemIds || contextCreateItemIds.length === 0 || !contextCreateTitle.trim() || contextCreateBusy) return
    const targetIds = new Set(contextCreateItemIds)
    const targets = mediaRef.current.filter((item) => item.kind === 'image' && !isRejected(item) && targetIds.has(item.id))
    const libraryId = targets[0]?.libraryId
    if (!libraryId || targets.length === 0) {
      setContextCreateError('The selected photos are no longer available in this index.')
      return
    }
    const next = createManualEventOverride(libraryId, targets, contextCreateTitle.trim())
    if (!next) {
      setContextCreateError('Choose an event name and at least one photo.')
      return
    }
    setContextCreateBusy(true)
    setContextCreateError(null)
    try {
      setError(null)
      await saveEventOverride(next)
      updateEventOverrideState([next])
      setContextCreateItemIds(null)
      setContextCreateTitle('')
    } catch (cause) {
      const message = `Event could not be created: ${messageOf(cause)}`
      setContextCreateError(message)
      setError(message)
    } finally {
      setContextCreateBusy(false)
    }
  }
""")

          replace(lite, """        {knownDatesOpen && activeLibrary && <KnownDatesDialog libraryId={activeLibrary.id} localRecords={activeLibrary.knownDates ?? []} globalRecords={globalKnownDates} years={years} onReplace={replaceKnownDates} onClose={() => setKnownDatesOpen(false)} />}
      </div>
""", """        {knownDatesOpen && activeLibrary && <KnownDatesDialog libraryId={activeLibrary.id} localRecords={activeLibrary.knownDates ?? []} globalRecords={globalKnownDates} years={years} onReplace={replaceKnownDates} onClose={() => setKnownDatesOpen(false)} />}
        {contextCreateItemIds && (
          <div className="pf-dialog-backdrop" role="presentation" onMouseDown={() => { if (!contextCreateBusy) setContextCreateItemIds(null) }}>
            <form className="pf-dialog event-rename-dialog" role="dialog" aria-modal="true" aria-label="Create event from selected photos" onMouseDown={(event) => event.stopPropagation()} onSubmit={(event) => { event.preventDefault(); void submitContextCreateEvent() }}>
              <div><span className="mode-kicker">Known event</span><h3>Create Event</h3><p>Create a persistent Known event from {contextCreateItemIds.length.toLocaleString()} selected photo{contextCreateItemIds.length === 1 ? '' : 's'}.</p></div>
              <label><span>Event name</span><input autoFocus value={contextCreateTitle} onChange={(event) => setContextCreateTitle(event.target.value)} placeholder="e.g. Easter holiday" /></label>
              {contextCreateError && <div className="notice error inline-notice">{contextCreateError}</div>}
              <div className="pf-dialog-actions">
                <button type="button" className="quiet-button" disabled={contextCreateBusy} onClick={() => setContextCreateItemIds(null)}>Cancel</button>
                <button type="submit" className="primary" disabled={contextCreateBusy || !contextCreateTitle.trim()}>{contextCreateBusy ? 'Creating…' : `Create event · ${contextCreateItemIds.length.toLocaleString()} photo${contextCreateItemIds.length === 1 ? '' : 's'}`}</button>
              </div>
            </form>
          </div>
        )}
      </div>
""")

          tests = "src/renderer/src/lite/eventOverrides.test.ts"
          replace(tests, """  it('can add a photo outside the detected membership and remove it again', () => {
    const items = [photo('1', 100), photo('2', 200), photo('3', 300)]
    const original = { ...event('event-a', ['1', '2'], 'Known event'), significance: 'known-date' as const }
    const added = createEventPhotoAdditionOverride(original, ['3'], undefined, 10)
    const expanded = applyEventOverrides([original], [added], items)[0]
    expect(expanded.itemIds).toEqual(['1', '2', '3'])
    expect(isKnownDateEvent(expanded)).toBe(true)

    const removed = createEventPhotoRemovalOverride(expanded, ['3'], added, 20)
    expect(applyEventOverrides([original], [removed], items)[0].itemIds).toEqual(['1', '2'])
  })
""", """  it('can add a photo outside the detected membership and remove it again', () => {
    const items = [photo('1', 100), photo('2', 200), photo('3', 300)]
    const original = { ...event('event-a', ['1', '2'], 'Known event'), significance: 'known-date' as const }
    const added = createEventPhotoAdditionOverride(original, ['3'], undefined, 10)
    const expanded = applyEventOverrides([original], [added], items)[0]
    expect(expanded.itemIds).toEqual(['1', '2', '3'])
    expect(isKnownDateEvent(expanded)).toBe(true)

    const removed = createEventPhotoRemovalOverride(expanded, ['3'], added, 20)
    expect(applyEventOverrides([original], [removed], items)[0].itemIds).toEqual(['1', '2'])
  })

  it('adds multiple selected Library photos to an existing manual Known event', () => {
    const items = [photo('1', 100), photo('2', 200), photo('3', 300), photo('4', 400)]
    const stored = createManualEventOverride('library', items.slice(0, 1), 'Holiday', 10)!
    const created = applyEventOverrides([], [stored], items)[0]
    const expanded = createEventPhotoAdditionOverride(created, ['2', '3', '4'], stored, 20)
    const applied = applyEventOverrides([], [expanded], items)[0]

    expect(applied.itemIds).toEqual(['1', '2', '3', '4'])
    expect(isKnownDateEvent(applied)).toBe(true)
  })
""")

          Path("src/renderer/src/lite/ContextMenuSelection.test.ts").write_text("""import { describe, expect, it } from 'vitest'
import { contextPhotoTargets } from './ContextMenu'

describe('context photo targets', () => {
  it('uses the full explorer selection when right-clicking a selected photo', () => {
    expect(contextPhotoTargets('b', ['a', 'b', 'c', 'b'])).toEqual(['a', 'b', 'c'])
  })

  it('uses only the clicked photo when it is outside the current selection', () => {
    expect(contextPhotoTargets('z', ['a', 'b', 'c'])).toEqual(['z'])
  })
})
""", encoding="utf-8")
