services:
  photofind:
    build: .
    ports:
      - "3000:3000"
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PHOTOFIND_HOST: 0.0.0.0
      PHOTOFIND_PORT: 3000
      PHOTOFIND_ENABLE_METADATA_REPAIR: "false"
    volumes:
      - photofind-config:/config
      - photofind-cache:/cache
      - photofind-inbox:/inbox
      - photofind-exports:/exports
      - ./photos:/photos:ro
    # Optional: set a numeric UID:GID that can write the four writable mounts.
    # user: "1000:1000"

volumes:
  photofind-config:
  photofind-cache:
  photofind-inbox:
  photofind-exports:
